name: Unpack Dealersim v7.1.0

on:
  push:
    paths:
      - "Dealersim-v7.1.0.zip"
      - ".github/workflows/unpack-v7.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack v7.1.0
        run: |
          set -e
          rm -rf /tmp/dealersim
          mkdir -p /tmp/dealersim
          unzip -q Dealersim-v7.1.0.zip -d /tmp/dealersim

          if [ -d /tmp/dealersim/Dealersim ]; then
            cp -a /tmp/dealersim/Dealersim/. .
          else
            cp -a /tmp/dealersim/. .
          fi

          rm -rf /tmp/dealersim

      - name: Commit extracted project
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted project changes."
            exit 0
          fi
          git commit -m "Extract Dealersim v7.1.0 project"
          git push
