name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: npm install
      - name: Build web and Android HTML
        run: npm run build
      - name: Build signed APK
        run: python3 tools/apk/build_apk.py --out release/Car-Dealership-Manager-Tycoon-v6.apk
      - name: Verify APK
        run: python3 tools/apk/verify_apk.py release/Car-Dealership-Manager-Tycoon-v6.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Car-Dealership-Manager-Tycoon-v6-APK
          path: release/Car-Dealership-Manager-Tycoon-v6.apk
