name: Unpack v5 ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack ZIP
        run: |
          set -e
          rm -rf .unpack
          mkdir .unpack
          unzip -q "Car-Dealership-Manager-Tycoon-v5.zip" -d .unpack
          shopt -s dotglob nullglob
          items=(.unpack/*)
          if [ "${#items[@]}" -eq 1 ] && [ -d "${items[0]}" ]; then SRC="${items[0]}"; else SRC=".unpack"; fi
          rm -rf "${SRC}/.git"
          cp -a "${SRC}/." .
          rm -rf .unpack "Car-Dealership-Manager-Tycoon-v5.zip"
      - name: Commit extracted game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack Car Dealership Manager Tycoon v5" || exit 0
          git push
