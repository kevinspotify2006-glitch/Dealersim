name: Unpack dealership game

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    if: "!contains(github.event.head_commit.message, 'Unpack dealership game')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack ZIP
        run: |
          rm -rf /tmp/dealership-game
          mkdir -p /tmp/dealership-game
          unzip -q -o Car-Dealership-Manager-Tycoon.zip -d /tmp/dealership-game
          cp -a /tmp/dealership-game/Car-Dealership-Manager-Tycoon/. .
          rm -f Car-Dealership-Manager-Tycoon.zip

      - name: Commit extracted game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Unpack dealership game"
          git push
