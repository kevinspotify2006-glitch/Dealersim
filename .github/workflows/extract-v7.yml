name: Extract Dealersim v7.1.0

on:
  push:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ZIP
        run: |
          set -e
          rm -rf /tmp/dealersim
          mkdir -p /tmp/dealersim
          unzip -q Dealersim-v7.1.0.zip -d /tmp/dealersim

          if [ -d /tmp/dealersim/Dealersim ]; then
            cp -a /tmp/dealersim/Dealersim/. .
          else
            cp -a /tmp/dealersim/. .
          fi

          # Do not overwrite GitHub Actions workflows: the GitHub App token
          # cannot push workflow-file changes without the workflows permission.
          rm -rf .github/workflows
          mkdir -p .github/workflows

          rm -rf /tmp/dealersim
          rm -f Dealersim-v7.1.0.zip
          rm -f .extract-trigger
          rm -f .github/workflows/extract-v7.yml

      - name: Commit extracted project
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Dealersim v7.1.0"
          git push
