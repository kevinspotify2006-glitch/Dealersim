name: Unpack dealership ZIP

on:
  push:
    branches: [main]
    paths:
      - "Car-Dealership-Manager-Tycoon-v4.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack ZIP into repository root
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Car-Dealership-Manager-Tycoon-v4.zip"
          test -f "$ZIP"

          rm -rf .unpack
          mkdir .unpack
          unzip -q "$ZIP" -d .unpack

          shopt -s dotglob nullglob
          items=(.unpack/*)

          if [ "${#items[@]}" -eq 1 ] && [ -d "${items[0]}" ]; then
            SRC="${items[0]}"
          else
            SRC=".unpack"
          fi

          # Never copy an archive's Git metadata into the repository.
          rm -rf "${SRC}/.git"

          cp -a "${SRC}/." .

          rm -rf .unpack "$ZIP"

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Unpack Car Dealership Manager Tycoon v4"
          git push
